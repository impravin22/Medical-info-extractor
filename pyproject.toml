[project]
name = "medical-summary-builder"
version = "0.1.0"
description = "LLM-assisted, deterministic medical summary generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11.0",
  "pypdf>=4.2.0",
  "python-docx>=1.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "rapidfuzz>=3.9.0",
  "structlog>=24.1.0",
  "transformers>=4.40.0",
  "torch>=2.0.0",
  "accelerate>=0.20.0",
  "google-generativeai>=0.8.5",
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "black>=24.3.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "black>=24.3.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E","F","I","N","UP","ANN","SIM","PL"]
ignore = []
fix = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = true

